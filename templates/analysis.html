{% extends "base.html" %}
{% block content %}

<h1>Analysis</h1>

<!-- ═══════════════════════════════════════════════════
     ANALYSIS TABS
════════════════════════════════════════════════════ -->
<div class="analysis-tabs">
    <button id="generalTabBtn" class="analysis-tab active" onclick="switchAnalysisTab('general')">
        General
    </button>
    <button id="headToHeadTabBtn" class="analysis-tab" onclick="switchAnalysisTab('headToHead')">
        Head-to-Head & Matchups
    </button>
</div>

<!-- ═══════════════════════════════════════════════════
     GENERAL TAB
════════════════════════════════════════════════════ -->
<div id="generalTab">

    <!-- ═══════════════════════════════════════════════════
         GRAPH BUILDER
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Build a Graph</h2>

        <div class="form-grid-3">
            <div>
                <label class="field-label">Type</label>
                <select id="chartType" class="form-control" onchange="updateSelections()">
                    <option value="team">Team</option>
                    <option value="player">Player</option>
                </select>
            </div>
            <div>
                <label class="field-label">Stat</label>
                <select id="chartStat" class="form-control">
                    <option value="points">Points</option>
                    <option value="assists">Assists</option>
                    <option value="rebounds">Rebounds</option>
                    <option value="steals">Steals</option>
                    <option value="blocks">Blocks</option>
                    <option value="turnovers">Turnovers</option>
                    <option value="fg_made">FG Made</option>
                    <option value="three_made">3PM</option>
                    <option value="plus_minus">Plus/Minus</option>
                    <option value="dunks">Dunks</option>
                </select>
            </div>
            <div>
                <label class="field-label">Last N Games</label>
                <input type="number" id="chartLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <!-- TEAM BUILDER -->
        <div id="teamBuilder">

            <div class="form-grid-2">

                <!-- YOUR TEAMS -->
                <div>
                    <label class="field-label field-label-user">Your Teams</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="yourTeamInput" class="form-control" placeholder="Search your teams..."
                            oninput="filterTeamDropdown('yours')" onfocus="filterTeamDropdown('yours')">
                        <div id="yourTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- OPPONENT TEAMS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Teams</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="oppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..."
                            oninput="filterTeamDropdown('opp')" onfocus="filterTeamDropdown('opp')">
                        <div id="oppTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <!-- TEAM TAGS -->
            <div id="teamTags" class="tag-list"></div>

        </div>

        <!-- PLAYER BUILDER -->
        <div id="playerBuilder" class="hidden">

            <div class="form-grid-2">

                <!-- YOUR PLAYERS -->
                <div>
                    <label class="field-label field-label-user">Your Players</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="yourPlayerInput" class="form-control" placeholder="Search your roster..."
                            oninput="filterDropdown('yours')" onfocus="filterDropdown('yours')">
                        <div id="yourPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- OPPONENT PLAYERS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Players</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="oppPlayerInput" class="form-control form-control-opp" placeholder="Search opponents..."
                            oninput="filterDropdown('opp')" onfocus="filterDropdown('opp')">
                        <div id="oppPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <!-- PLAYER TAGS -->
            <div id="playerTags" class="tag-list"></div>

        </div>

        <button class="primary-action-btn" onclick="addGraph()">
            Add Graph
        </button>
    </div>

    <div id="graphsContainer"></div>

</div>

<!-- ═══════════════════════════════════════════════════
     HEAD-TO-HEAD & MATCHUPS TAB
════════════════════════════════════════════════════ -->
<div id="headToHeadTab" style="display:none;">

    <!-- ═══════════════════════════════════════════════════
         HEAD-TO-HEAD GRAPH BUILDER
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Head-to-Head Graph Builder</h2>

        <div class="form-grid-3">
            <div>
                <label class="field-label">Type</label>
                <select id="h2hChartType" class="form-control" onchange="updateH2HSelections()">
                    <option value="team">Team</option>
                    <option value="player">Player</option>
                </select>
            </div>
            <div>
                <label class="field-label">Stat</label>
                <select id="h2hChartStat" class="form-control">
                    <option value="points">Points</option>
                    <option value="assists">Assists</option>
                    <option value="rebounds">Rebounds</option>
                    <option value="steals">Steals</option>
                    <option value="blocks">Blocks</option>
                    <option value="turnovers">Turnovers</option>
                    <option value="fg_made">FG Made</option>
                    <option value="three_made">3PM</option>
                    <option value="plus_minus">Plus/Minus</option>
                    <option value="dunks">Dunks</option>
                </select>
            </div>
            <div>
                <label class="field-label">Last N Matchups</label>
                <input type="number" id="h2hChartLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <!-- H2H TEAM BUILDER -->
        <div id="h2hTeamBuilder">

            <div class="form-grid-2">

                <!-- H2H YOUR TEAMS -->
                <div>
                    <label class="field-label field-label-user">Your Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hYourTeamInput" class="form-control" placeholder="Search your teams..."
                            oninput="filterH2HTeamDropdown('yours')" onfocus="filterH2HTeamDropdown('yours')">
                        <div id="h2hYourTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- H2H OPPONENT TEAMS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hOppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..."
                            oninput="filterH2HTeamDropdown('opp')" onfocus="filterH2HTeamDropdown('opp')">
                        <div id="h2hOppTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <div id="h2hTeamTags" class="tag-list"></div>

        </div>

        <!-- H2H PLAYER BUILDER -->
        <div id="h2hPlayerBuilder" class="hidden">

            <div class="form-grid-2">

                <!-- H2H YOUR PLAYERS -->
                <div>
                    <label class="field-label field-label-user">Your Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hYourPlayerInput" class="form-control" placeholder="Search your roster..."
                            oninput="filterH2HPlayerDropdown('yours')" onfocus="filterH2HPlayerDropdown('yours')">
                        <div id="h2hYourPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- H2H OPPONENT PLAYERS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hOppPlayerInput" class="form-control form-control-opp" placeholder="Search opponents..."
                            oninput="filterH2HPlayerDropdown('opp')" onfocus="filterH2HPlayerDropdown('opp')">
                        <div id="h2hOppPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <div id="h2hPlayerTags" class="tag-list"></div>

        </div>

        <button class="primary-action-btn" onclick="addH2HGraph()">
            Add Graph
        </button>
    </div>

    <div id="h2hGraphsContainer"></div>

    <!-- ═══════════════════════════════════════════════════
        TEAM MATCHUP
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Team Matchup</h2>

        <div class="form-grid-matchup">
            <div>
                <label class="field-label">Your Team</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="teamMatchupYourTeamInput" class="form-control" placeholder="Search your teams..." autocomplete="off"
                        oninput="filterTeamMatchupDropdown('yours')" onfocus="filterTeamMatchupDropdown('yours')">
                    <div id="teamMatchupYourTeamDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Opponent Team</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="teamMatchupOppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..." autocomplete="off"
                        oninput="filterTeamMatchupDropdown('opp')" onfocus="filterTeamMatchupDropdown('opp')">
                    <div id="teamMatchupOppTeamDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Last N Games</label>
                <input type="number" id="teamMatchupLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <button class="primary-action-btn" onclick="loadTeamMatchup()">
            Generate
        </button>
        <div id="teamMatchupResults" class="results-container"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════
        PLAYER MATCHUP TABLE
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Player Matchup</h2>

        <div class="form-grid-player-matchup">
            <div>
                <label class="field-label">Players (Your Team)</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="matchupPlayerInput" class="form-control" placeholder="Type a player name..."
                        oninput="filterMatchupDropdown()" onfocus="filterMatchupDropdown()">
                    <div id="matchupPlayerDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Opponent Team</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="playerMatchupOppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..." autocomplete="off"
                        oninput="filterPlayerMatchupOppTeamDropdown()" onfocus="filterPlayerMatchupOppTeamDropdown()">
                    <div id="playerMatchupOppTeamDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Last N Games</label>
                <input type="number" id="playerMatchupLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <button class="primary-action-btn" onclick="loadPlayerMatchup()">
            Generate
        </button>
        <div id="playerMatchupResults" class="results-container"></div>
    </div>

</div>

<style>
    /* ─── FORM LABELS ───────────────────────────────── */

    .field-label {
        display: block;
        color: #666;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.4rem;
    }

    .field-label-user {
        color: #98002E;
    }

    .field-label-opp {
        color: #2196F3;
    }

    /* ─── LAYOUT HELPERS ─────────────────────────────── */

    .form-grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .form-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 1rem;
    }

    .form-grid-matchup {
        display: grid;
        grid-template-columns: 2fr 2fr 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .form-grid-player-matchup {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .autocomplete-wrapper {
        position: relative;
    }

    .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
        min-height: 2rem;
    }

    .results-container {
        margin-top: 1.5rem;
    }

    .hidden {
        display: none;
    }

    /* ─── FORM CONTROLS ──────────────────────────────── */

    .form-control {
        background: #1a1a1a;
        color: #e0e0e0;
        border: 1px solid #333;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        width: 100%;
        font-size: 0.9rem;
        box-sizing: border-box;
    }

    .form-control-opp {
        border-color: #2196F320;
    }

    select.form-control {
        padding-right: 2rem;
    }

    /* Hide number input arrows/spinners */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type="number"] {
        -moz-appearance: textfield;
    }

    /* ─── AUTOCOMPLETE DROPDOWNS ─────────────────────── */

    .autocomplete-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 100;
    }

    /* ─── BUTTONS ───────────────────────────────────── */

    .primary-action-btn {
        background: #98002E;
        color: #fff;
        border: none;
        padding: 0.6rem 1.5rem;
        border-radius: 4px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .remove-graph-btn {
        background: none;
        border: 1px solid #333;
        color: #666;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
    }

    /* ─── TAGS ──────────────────────────────────────── */

    .player-tag {
        color: #fff;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    .tag-control {
        background: rgba(255,255,255,0.15);
        border: none;
        color: #fff;
        border-radius: 3px;
        padding: 0.1rem 0.4rem;
        font-size: 0.7rem;
        cursor: pointer;
    }

    .tag-control.active {
        background: rgba(255,255,255,0.35);
        font-weight: 700;
    }

    /* ─── ANALYSIS TABS ─────────────────────────────── */

    .analysis-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #222;
    }

    .analysis-tab {
        background: transparent;
        color: #777;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 0.8rem 1rem;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .analysis-tab:hover {
        color: #e0e0e0;
    }

    .analysis-tab.active {
        color: #fff;
        border-bottom-color: #98002E;
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const teams = {{ teams | tojson }};
const oppTeams = {{ opp_teams | tojson }};
const yourPlayers = {{ your_players | tojson }};
const oppPlayers = {{ opp_players | tojson }};

// Normalize backend team lists into option objects used by autocomplete and tag selection.
const yourTeamOptions = teams.map(t => ({
    label: t,
    team_name: t,
    side: 'yours',
    key: `${t}||yours`
}));

const oppTeamOptions = oppTeams.map(t => ({
    label: t,
    team_name: t,
    side: 'opp',
    key: `${t}||opp`
}));

// Include team names in player labels because classic rosters can contain the same player.
const yourPlayerOptions = yourPlayers.map(p => ({
    label: `${p.player_name} (${p.team_name})`,
    player_name: p.player_name,
    team_name: p.team_name,
    side: 'yours'
}));

const oppPlayerOptions = oppPlayers.map(p => ({
    label: `${p.player_name} (${p.team_name})`,
    player_name: p.player_name,
    team_name: p.team_name,
    side: 'opp'
}));

// Player matchup table only compares players from the user's teams against opponent teams.
const matchupPlayerOptions = yourPlayers.map(p => ({
    label: `${p.player_name} (${p.team_name})`,
    player_name: p.player_name,
    team_name: p.team_name,
    key: `${p.player_name}||${p.team_name}`
}));

const teamMatchupYourTeamOptions = [
    { label: 'All Teams', team_name: 'all', key: 'all' },
    ...teams.map(t => ({
        label: t,
        team_name: t,
        key: t
    }))
];

const teamMatchupOppTeamOptions = oppTeams.map(t => ({
    label: t,
    team_name: t,
    key: t
}));

let teamMatchupYourTeamSelection = { label: 'All Teams', team_name: 'all', key: 'all' };
let teamMatchupOppTeamSelection = null;
let playerMatchupOppTeamSelection = null;
let playerMatchupPlayerSelection = null;

// Chart datasets cycle through these colors when multiple teams or players are graphed.
const lineColors = [
    '#98002E', '#2196F3', '#4caf50', '#FF9800', '#9C27B0',
    '#00BCD4', '#FF5722', '#8BC34A', '#FFC107', '#E91E63'
];

let graphCount = 0;
let selectedTeams = new Map();

// Player selections use composite keys to separate same-name players by team, side, and home/away filter.
let graphPlayers = new Map();

// H2H graph builder selections
let h2hSelectedTeams = new Map();
let h2hSelectedPlayers = new Map();

// ─── ANALYSIS TABS ───────────────────────────────────

function switchAnalysisTab(tab) {
    const generalTab = document.getElementById('generalTab');
    const headToHeadTab = document.getElementById('headToHeadTab');
    const generalBtn = document.getElementById('generalTabBtn');
    const headToHeadBtn = document.getElementById('headToHeadTabBtn');

    if (tab === 'general') {
        generalTab.style.display = 'block';
        headToHeadTab.style.display = 'none';
        generalBtn.classList.add('active');
        headToHeadBtn.classList.remove('active');
    } else {
        generalTab.style.display = 'none';
        headToHeadTab.style.display = 'block';
        generalBtn.classList.remove('active');
        headToHeadBtn.classList.add('active');
    }
}

// ─── GRAPH BUILDER ───────────────────────────────────

function updateSelections() {
    const type = document.getElementById('chartType').value;
    selectedTeams.clear();
    graphPlayers.clear();
    document.getElementById('teamTags').innerHTML = '';
    document.getElementById('playerTags').innerHTML = '';

    if (type === 'team') {
        document.getElementById('teamBuilder').style.display = 'block';
        document.getElementById('playerBuilder').style.display = 'none';
    } else {
        document.getElementById('teamBuilder').style.display = 'none';
        document.getElementById('playerBuilder').style.display = 'block';
    }
}

function filterTeamDropdown(side) {
    const inputId = side === 'yours' ? 'yourTeamInput' : 'oppTeamInput';
    const dropdownId = side === 'yours' ? 'yourTeamDropdown' : 'oppTeamDropdown';
    const options = side === 'yours' ? yourTeamOptions : oppTeamOptions;
    const accentColor = side === 'yours' ? '#98002E' : '#2196F3';

    const input = document.getElementById(inputId).value.toLowerCase();
    const dropdown = document.getElementById(dropdownId);
    clearDropdown(dropdownId);

    const filtered = options.filter(t =>
        t.label.toLowerCase().includes(input) && !selectedTeams.has(t.key)
    );

    if (filtered.length === 0) { dropdown.style.display = 'none'; return; }

    filtered.slice(0, 10).forEach(t => {
        dropdown.appendChild(
            createDropdownItem(t.label, () => addTeamTag(t, accentColor, inputId, dropdownId))
        );
    });

    dropdown.style.display = 'block';
}

function addTeamTag(t, accentColor, inputId, dropdownId) {
    document.getElementById(inputId).value = '';
    hideDropdown(dropdownId);

    if (selectedTeams.has(t.key)) return;

    selectedTeams.set(t.key, t);

    const sideLabel = getSideLabel(t.side);
    const tag = document.createElement('span');
    tag.className = 'player-tag';
    tag.dataset.key = t.key;
    tag.style.background = accentColor;

    tag.innerHTML = `
        <span class="tag-name">${t.team_name} [${sideLabel}]</span>
        <span style="cursor:pointer; font-weight:bold; margin-left:0.25rem;" onclick="removeTeamTag('${t.key}')">×</span>
    `;

    document.getElementById('teamTags').appendChild(tag);
}

function removeTagFromMap(map, key, selector) {
    map.delete(key);
    const tag = document.querySelector(selector);
    if (tag) tag.remove();
}

function getExistingPlayerTeamKeys(selectionMap, side) {
    return new Set(
        [...selectionMap.keys()]
            .filter(k => k.includes(`||${side}`))
            .map(k => k.split('||').slice(0, 2).join('||'))
    );
}

function getSideLabel(side) {
    return side === 'yours' ? 'User' : 'Opp';
}

function removeTeamTag(key) {
    removeTagFromMap(
        selectedTeams,
        key,
        `.player-tag[data-key="${CSS.escape(key)}"]`
    );
}

function filterDropdown(side) {
    const inputId = side === 'yours' ? 'yourPlayerInput' : 'oppPlayerInput';
    const dropdownId = side === 'yours' ? 'yourPlayerDropdown' : 'oppPlayerDropdown';
    const options = side === 'yours' ? yourPlayerOptions : oppPlayerOptions;
    const accentColor = side === 'yours' ? '#98002E' : '#2196F3';

    const input = document.getElementById(inputId).value.toLowerCase();
    const dropdown = document.getElementById(dropdownId);
    clearDropdown(dropdownId);

    // Prevent duplicate player tags on the same side by matching player name and team.
    const existing = getExistingPlayerTeamKeys(graphPlayers, side);
    const filtered = options.filter(p =>
        p.label.toLowerCase().includes(input) && !existing.has(`${p.player_name}||${p.team_name}`)
    );

    if (filtered.length === 0) { dropdown.style.display = 'none'; return; }

    filtered.slice(0, 10).forEach(p => {
        dropdown.appendChild(
            createDropdownItem(p.label, () => addPlayerTag(p, side, accentColor, inputId, dropdownId))
        );
    });

    dropdown.style.display = 'block';
}

function addPlayerTag(p, side, accentColor, inputId, dropdownId) {
    document.getElementById(inputId).value = '';
    hideDropdown(dropdownId);

    // New player tags default to all games until the user selects home or away.
    const key = `${p.player_name}||${p.team_name}||${side}||both`;
    if (graphPlayers.has(key)) return;

    graphPlayers.set(key, { option: p, homeAway: 'both' });

    const sideLabel = getSideLabel(side);
    const tag = document.createElement('span');
    tag.className = 'player-tag';
    tag.dataset.key = key;
    tag.style.background = accentColor;

    tag.innerHTML = `
        <span class="tag-name">${p.player_name} (${p.team_name}) [${sideLabel}]</span>
        <button class="tag-control active" data-ha="both" onclick="setHomeAway(this, '${key}', 'both')">All</button>
        <button class="tag-control" data-ha="home" onclick="setHomeAway(this, '${key}', 'home')">H</button>
        <button class="tag-control" data-ha="away" onclick="setHomeAway(this, '${key}', 'away')">A</button>
        <span style="cursor:pointer; font-weight:bold; margin-left:0.25rem;" onclick="removePlayerTag('${key}')">×</span>
    `;

    document.getElementById('playerTags').appendChild(tag);
}

function setHomeAway(btn, oldKey, newHa) {
    const tag = btn.closest('.player-tag');
    const parts = oldKey.split('||');
    const player_name = parts[0];
    const team_name = parts[1];
    const side = parts[2];
    const newKey = `${player_name}||${team_name}||${side}||${newHa}`;

    // Update map
    const entry = graphPlayers.get(oldKey);
    if (!entry) return;
    graphPlayers.delete(oldKey);
    graphPlayers.set(newKey, { ...entry, homeAway: newHa });

    // Update tag key
    tag.dataset.key = newKey;

    // Update button onclick refs
    tag.querySelectorAll('.tag-control').forEach(b => {
        const ha = b.dataset.ha;
        b.onclick = () => setHomeAway(b, newKey, ha);
        b.classList.toggle('active', ha === newHa);
    });

    // Update remove button
    tag.querySelector('span[style*="cursor:pointer"]').onclick = () => removePlayerTag(newKey);
}

function removePlayerTag(key) {
    removeTagFromMap(
        graphPlayers,
        key,
        `.player-tag[data-key="${CSS.escape(key)}"]`
    );
}

async function addH2HGraph() {
    const type = document.getElementById('h2hChartType').value;
    const stat = document.getElementById('h2hChartStat').value;
    const limit = document.getElementById('h2hChartLimit').value || 'all';
    const statLabel = document.getElementById('h2hChartStat').selectedOptions[0].text;
    const limitLabel = limit === 'all' ? 'All Matchups' : `Last ${limit}`;

    let selectionKeys = [];
    let selectionLabels = [];

    // H2H graphs require at least one selection from each side.
    if (type === 'team') {
        const hasYourTeam = [...h2hSelectedTeams.values()].some(t => t.side === 'yours');
        const hasOppTeam = [...h2hSelectedTeams.values()].some(t => t.side === 'opp');

        if (!hasYourTeam || !hasOppTeam) {
            alert('Head-to-head team graphs need at least one Your Side team and one Opponent Side team.');
            return;
        }

        selectionKeys = [...h2hSelectedTeams.keys()];
        selectionLabels = selectionKeys.map(k => {
            const team = h2hSelectedTeams.get(k);
            const sideLabel = getSideLabel(team.side);
            return `${team.team_name} [${sideLabel}]`;
        });
    } else {
        const hasYourPlayer = [...h2hSelectedPlayers.keys()].some(k => k.split('||')[2] === 'yours');
        const hasOppPlayer = [...h2hSelectedPlayers.keys()].some(k => k.split('||')[2] === 'opp');

        if (!hasYourPlayer || !hasOppPlayer) {
            alert('Head-to-head player graphs need at least one Your Side player and one Opponent Side player.');
            return;
        }

        selectionKeys = [...h2hSelectedPlayers.keys()];
        selectionLabels = selectionKeys.map(k => {
            const [name, team, side] = k.split('||');
            const sideLabel = getSideLabel(side);
            return `${name} (${team}) [${sideLabel}]`;
        });
    }

    const params = new URLSearchParams({ type, stat, limit });
    selectionKeys.forEach(k => params.append('selections', k));

    const res = await fetch(`/api/h2h_graph_data?${params}`);
    const data = await res.json();

    if (!res.ok) {
        alert(data.error || 'Could not load head-to-head graph data.');
        return;
    }

    const hasData = Object.values(data).some(gameList => gameList.length > 0);
    if (!hasData) {
        alert('No head-to-head matchup data found for those selections.');
        return;
    }

    renderH2HGraph(data, selectionKeys, selectionLabels, statLabel, limitLabel);
}

function buildGameAxis(data) {
    const allGames = [];
    const seenGames = new Set();

    Object.values(data).forEach(gameList => {
        gameList.forEach(g => {
            if (!seenGames.has(g.game_id)) {
                seenGames.add(g.game_id);
                allGames.push({
                    game_id: g.game_id,
                    date: g.date
                });
            }
        });
    });

    allGames.sort((a, b) => {
        if (a.date === b.date) {
            return a.game_id - b.game_id;
        }
        return a.date.localeCompare(b.date);
    });

    return {
        allGames,
        labels: allGames.map(g => g.date)
    };
}

function renderH2HGraph(data, selectionKeys, selectionLabels, statLabel, limitLabel) {
    const graphId = `h2h_graph_${graphCount++}`;

    const { allGames, labels } = buildGameAxis(data);

    const card = document.createElement('div');
    card.className = 'card';
    card.id = graphId;
    card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>H2H ${statLabel} — ${selectionLabels.join(' vs ')} (${limitLabel})</h2>
            <button onclick="document.getElementById('${graphId}').remove()"
                style="background:none; border:1px solid #333; color:#666; padding:0.3rem 0.8rem; border-radius:4px; cursor:pointer; font-size:0.8rem;">
                Remove
            </button>
        </div>
        <canvas id="canvas_${graphId}" height="80"></canvas>
    `;
    document.getElementById('h2hGraphsContainer').appendChild(card);

    const datasets = selectionKeys.map((key, i) => {
        const gameData = data[key] || [];

        // Map each selection's data by game_id so missing games can render as gaps.
        const gameMap = {};
        gameData.forEach(g => gameMap[g.game_id] = g);

        return {
            label: selectionLabels[i],
            data: allGames.map(game => gameMap[game.game_id] ? gameMap[game.game_id].value : null),
            borderColor: lineColors[i % lineColors.length],
            backgroundColor: lineColors[i % lineColors.length] + '20',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: allGames.map(game => {
                const g = gameMap[game.game_id];
                if (!g) return '#444';
                return g.win_loss === 'W' ? '#4caf50' : '#98002E';
            }),
            tension: 0.3,
            fill: false,
            spanGaps: false
        };
    });

    new Chart(document.getElementById(`canvas_${graphId}`), {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#888' } },
                tooltip: {
                    callbacks: {
                        afterLabel: (ctx) => {
                            const key = selectionKeys[ctx.datasetIndex];
                            const gameData = data[key] || [];
                            const game = gameData.find(g => g.game_id === allGames[ctx.dataIndex].game_id);
                            if (game) {
                                const ha = game.home_away === 'H' ? 'Home' : 'Away';
                                return `${game.win_loss === 'W' ? 'WIN' : 'LOSS'} vs ${game.opp_team} (${ha})`;
                            }
                            return '';
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { color: '#666', maxTicksLimit: 15 }, grid: { color: '#1a1a1a' } },
                y: { ticks: { color: '#666' }, grid: { color: '#1a1a1a' }, min: 0 }
            }
        }
    });
}

// Display labels for the matchup comparison tables.
const statLabels = {
    pts: 'PTS', ast: 'AST', reb: 'REB', stl: 'STL',
    blk: 'BLK', to_: 'TO', fgm: 'FGM', fga: 'FGA',
    fg_pct: 'FG%', tpm: '3PM', tpa: '3PA', three_pct: '3P%',
    ftm: 'FTM', fta: 'FTA', ft_pct: 'FT%'
};

// Reused by both team and player matchup tables to compare overall averages against opponent-specific averages.
function buildComparisonTable(overall, vs_opp, label) {
    const stats = Object.keys(statLabels);
    let rows = '';
    stats.forEach(stat => {
        if (overall[stat] === undefined) return;
        const o = overall[stat] ?? '-';
        const v = vs_opp[stat] ?? '-';
        let diff = '-', diffColor = '#888';
        if (typeof o === 'number' && typeof v === 'number') {
            const d = (v - o).toFixed(2);
            diff = d > 0 ? `+${d}` : `${d}`;
            diffColor = d > 0 ? '#4caf50' : d < 0 ? '#98002E' : '#888';
        }
        rows += `<tr>
            <td>${statLabels[stat]}</td>
            <td>${o}</td>
            <td>${v}</td>
            <td style="color:${diffColor}; font-weight:600;">${diff}</td>
        </tr>`;
    });
    return `
        <div style="margin-bottom:1.5rem;">
            <h3 style="margin-bottom:0.75rem;">${label}</h3>
            <table>
                <thead><tr><th>Stat</th><th>Overall Avg</th><th>vs Opponent</th><th>Diff</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}
