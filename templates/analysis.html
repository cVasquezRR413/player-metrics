{% extends "base.html" %}
{% block content %}

<h1>Analysis</h1>

<div class="card">
    <h2>Build a Graph</h2>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1rem;">

        <div>
            <label style="display:block; color:#666; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.4rem;">Type</label>
            <select id="chartType" onchange="updateSelections()" style="width:100%;">
                <option value="team">Team</option>
                <option value="player">Player</option>
            </select>
        </div>

        <div>
            <label style="display:block; color:#666; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.4rem;">Stat</label>
            <select id="chartStat" style="width:100%;">
                <option value="points">Points</option>
                <option value="assists">Assists</option>
                <option value="rebounds">Rebounds</option>
                <option value="steals">Steals</option>
                <option value="blocks">Blocks</option>
                <option value="turnovers">Turnovers</option>
                <option value="fg_made">FG Made</option>
                <option value="three_made">3PM</option>
                <option value="dunks">Dunks</option>
            </select>
        </div>

        <div>
            <label style="display:block; color:#666; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.4rem;">Last N Games</label>
            <select id="chartLimit" style="width:100%;">
                <option value="all">All Games</option>
                <option value="10">Last 10</option>
                <option value="20" selected>Last 20</option>
                <option value="50">Last 50</option>
            </select>
        </div>

    </div>

    <div style="margin-bottom: 1rem;">
        <label style="display:block; color:#666; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.4rem;">Select Teams / Players to Compare</label>

        <!-- Team buttons -->
        <div id="teamButtons" style="display:flex; flex-wrap:wrap; gap:0.5rem;"></div>

        <!-- Player search -->
        <div id="playerSearch" style="display:none;">
            <div style="position:relative; display:inline-block; margin-bottom:0.5rem;">
                <input type="text" id="playerInput" placeholder="Type a player name..."
                    oninput="filterPlayerDropdown()"
                    onfocus="showPlayerDropdown()"
                    style="background:#1a1a1a; color:#e0e0e0; border:1px solid #333; padding:0.5rem 1rem; border-radius:4px; width:350px; font-size:0.9rem;">
                <div id="playerDropdown"
                    style="display:none; position:absolute; top:100%; left:0; width:350px; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                </div>
            </div>
            <div id="playerTags" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.5rem;"></div>
        </div>
    </div>

    <button onclick="addGraph()"
        style="background:#98002E; color:#fff; border:none; padding:0.6rem 1.5rem; border-radius:4px; font-size:0.9rem; font-weight:600; cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;">
        Add Graph
    </button>
</div>

<div id="graphsContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
    const teams = {{ teams | tojson }};
    const players = {{ players | tojson }};

    // Build player list as "Name (Team)" for display, with separate key for API
    const playerOptions = players.map(p => ({
        label: `${p.player_name} (${p.team_name})`,
        player_name: p.player_name,
        team_name: p.team_name,
        key: `${p.player_name}||${p.team_name}`
    }));

    const lineColors = [
        '#98002E', '#4caf50', '#2196F3', '#FF9800', '#9C27B0',
        '#00BCD4', '#FF5722', '#8BC34A', '#FFC107', '#E91E63'
    ];

    let graphCount = 0;
    let selectedItems = new Map(); // key -> display label

    function updateSelections() {
        const type = document.getElementById('chartType').value;
        selectedItems.clear();

        document.getElementById('teamButtons').innerHTML = '';
        document.getElementById('playerTags').innerHTML = '';
        document.getElementById('playerInput') && (document.getElementById('playerInput').value = '');

        if (type === 'team') {
            document.getElementById('teamButtons').style.display = 'flex';
            document.getElementById('playerSearch').style.display = 'none';

            teams.forEach(item => {
                const btn = document.createElement('button');
                btn.textContent = item;
                btn.dataset.value = item;
                btn.style.cssText = `
                    background: #1a1a1a; color: #888; border: 1px solid #333;
                    padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
                    font-size: 0.8rem; transition: all 0.15s;
                `;
                btn.onclick = () => toggleTeam(btn, item);
                document.getElementById('teamButtons').appendChild(btn);
            });
        } else {
            document.getElementById('teamButtons').style.display = 'none';
            document.getElementById('playerSearch').style.display = 'block';
            filterPlayerDropdown();
        }
    }

    function toggleTeam(btn, item) {
        if (selectedItems.has(item)) {
            selectedItems.delete(item);
            btn.style.background = '#1a1a1a';
            btn.style.color = '#888';
            btn.style.borderColor = '#333';
        } else {
            selectedItems.set(item, item);
            btn.style.background = '#98002E';
            btn.style.color = '#fff';
            btn.style.borderColor = '#98002E';
        }
    }

    function filterPlayerDropdown() {
        const input = document.getElementById('playerInput').value.toLowerCase();
        const dropdown = document.getElementById('playerDropdown');
        dropdown.innerHTML = '';

        const filtered = playerOptions.filter(p =>
            p.label.toLowerCase().includes(input) && !selectedItems.has(p.key)
        );

        if (filtered.length === 0) {
            dropdown.style.display = 'none';
            return;
        }

        filtered.slice(0, 10).forEach(p => {
            const item = document.createElement('div');
            item.textContent = p.label;
            item.style.cssText = `
                padding: 0.5rem 1rem; cursor: pointer; color: #ccc; font-size: 0.85rem;
            `;
            item.onmouseenter = () => item.style.background = '#2a2a2a';
            item.onmouseleave = () => item.style.background = 'transparent';
            item.onclick = () => selectPlayer(p);
            dropdown.appendChild(item);
        });

        dropdown.style.display = 'block';
    }

    function showPlayerDropdown() {
        filterPlayerDropdown();
    }

    function selectPlayer(p) {
        selectedItems.set(p.key, p.label);
        document.getElementById('playerInput').value = '';
        document.getElementById('playerDropdown').style.display = 'none';

        const tag = document.createElement('span');
        tag.style.cssText = `
            background: #98002E; color: #fff; padding: 0.3rem 0.8rem;
            border-radius: 4px; font-size: 0.8rem; display:inline-flex; align-items:center; gap:0.5rem;
        `;
        tag.dataset.key = p.key;
        tag.innerHTML = `${p.label} <span style="cursor:pointer; font-weight:bold;" onclick="removePlayerTag(this, '${p.key}')">×</span>`;
        document.getElementById('playerTags').appendChild(tag);
    }

    function removePlayerTag(el, key) {
        selectedItems.delete(key);
        el.parentElement.remove();
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('playerDropdown');
        const input = document.getElementById('playerInput');
        if (dropdown && input && !input.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });

    async function addGraph() {
        if (selectedItems.size === 0) {
            alert('Please select at least one team or player.');
            return;
        }

        const type = document.getElementById('chartType').value;
        const stat = document.getElementById('chartStat').value;
        const limit = document.getElementById('chartLimit').value;

        const params = new URLSearchParams();
        params.append('type', type);
        params.append('stat', stat);
        params.append('limit', limit);

        const selectionKeys = [...selectedItems.keys()];
        const selectionLabels = [...selectedItems.values()];

        selectionKeys.forEach(k => params.append('selections', k));

        const response = await fetch(`/api/chart_data?${params.toString()}`);
        const data = await response.json();

        const graphId = `graph_${graphCount++}`;
        const statLabel = document.getElementById('chartStat').options[document.getElementById('chartStat').selectedIndex].text;
        const limitLabel = document.getElementById('chartLimit').options[document.getElementById('chartLimit').selectedIndex].text;

        const card = document.createElement('div');
        card.className = 'card';
        card.id = graphId;
        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h2>${statLabel} — ${selectionLabels.join(' vs ')} (${limitLabel})</h2>
                <button onclick="removeGraph('${graphId}')"
                    style="background:none; border:1px solid #333; color:#666; padding:0.3rem 0.8rem; border-radius:4px; cursor:pointer; font-size:0.8rem;">
                    Remove
                </button>
            </div>
            <canvas id="canvas_${graphId}" height="80"></canvas>
        `;

        document.getElementById('graphsContainer').appendChild(card);

        const allDates = [...new Set(
            Object.values(data).flatMap(d => d.map(g => g.date))
        )].sort();

        console.log('Data received:', JSON.stringify(Object.keys(data)));
        console.log('Selection keys:', selectionKeys);
        const datasets = selectionKeys.map((key, i) => {
            const gameData = data[key] || [];
            const dateMap = {};
            gameData.forEach(g => dateMap[g.date] = g);

            return {
                label: selectionLabels[i],
                data: allDates.map(d => dateMap[d] ? dateMap[d].value : null),
                borderColor: lineColors[i % lineColors.length],
                backgroundColor: lineColors[i % lineColors.length] + '20',
                borderWidth: 2,
                pointRadius: 4,
                pointBackgroundColor: allDates.map(d => {
                    if (!dateMap[d]) return '#444';
                    return dateMap[d].win_loss === 'W' ? '#4caf50' : '#98002E';
                }),
                tension: 0.3,
                fill: false,
                spanGaps: false
            };
        });

        new Chart(document.getElementById(`canvas_${graphId}`), {
            type: 'line',
            data: { labels: allDates, datasets },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#888' } },
                    tooltip: {
                        callbacks: {
                            afterLabel: (ctx) => {
                                const key = selectionKeys[ctx.datasetIndex];
                                const gameData = data[key] || [];
                                const game = gameData.find(g => g.date === allDates[ctx.dataIndex]);
                                if (game) return `${game.win_loss === 'W' ? 'WIN' : 'LOSS'} vs ${game.opp_team}`;
                                return '';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#666', maxTicksLimit: 15 },
                        grid: { color: '#1a1a1a' }
                    },
                    y: {
                        ticks: { color: '#666' },
                        grid: { color: '#1a1a1a' },
                        min: 0
                    }
                }
            }
        });
    }

    function removeGraph(id) {
        document.getElementById(id).remove();
    }

    updateSelections();
</script>

{% endblock %}
