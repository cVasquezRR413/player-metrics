{% extends "base.html" %}
{% block content %}

<h1>Analysis</h1>

<!-- ═══════════════════════════════════════════════════
     ANALYSIS TABS
════════════════════════════════════════════════════ -->
<div class="analysis-tabs">
    <button id="generalTabBtn" class="analysis-tab active" onclick="switchAnalysisTab('general')">
        General
    </button>
    <button id="headToHeadTabBtn" class="analysis-tab" onclick="switchAnalysisTab('headToHead')">
        Head-to-Head & Matchups
    </button>
</div>

<!-- ═══════════════════════════════════════════════════
     GENERAL TAB
════════════════════════════════════════════════════ -->
<div id="generalTab">

    <!-- ═══════════════════════════════════════════════════
         GRAPH BUILDER
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Build a Graph</h2>

        <div class="form-grid-3">
            <div>
                <label class="field-label">Type</label>
                <select id="chartType" class="form-control" onchange="updateSelections()">
                    <option value="team">Team</option>
                    <option value="player">Player</option>
                </select>
            </div>
            <div>
                <label class="field-label">Stat</label>
                <select id="chartStat" class="form-control">
                    <option value="points">Points</option>
                    <option value="assists">Assists</option>
                    <option value="rebounds">Rebounds</option>
                    <option value="steals">Steals</option>
                    <option value="blocks">Blocks</option>
                    <option value="turnovers">Turnovers</option>
                    <option value="fg_made">FG Made</option>
                    <option value="three_made">3PM</option>
                    <option value="plus_minus">Plus/Minus</option>
                    <option value="dunks">Dunks</option>
                </select>
            </div>
            <div>
                <label class="field-label">Last N Games</label>
                <input type="number" id="chartLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <!-- TEAM BUILDER -->
        <div id="teamBuilder">

            <div class="form-grid-2">

                <!-- YOUR TEAMS -->
                <div>
                    <label class="field-label field-label-user">Your Teams</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="yourTeamInput" class="form-control" placeholder="Search your teams..."
                            oninput="filterTeamDropdown('yours')" onfocus="filterTeamDropdown('yours')">
                        <div id="yourTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- OPPONENT TEAMS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Teams</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="oppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..."
                            oninput="filterTeamDropdown('opp')" onfocus="filterTeamDropdown('opp')">
                        <div id="oppTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <!-- TEAM TAGS -->
            <div id="teamTags" class="tag-list"></div>

        </div>

        <!-- PLAYER BUILDER -->
        <div id="playerBuilder" class="hidden">

            <div class="form-grid-2">

                <!-- YOUR PLAYERS -->
                <div>
                    <label class="field-label field-label-user">Your Players</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="yourPlayerInput" class="form-control" placeholder="Search your roster..."
                            oninput="filterDropdown('yours')" onfocus="filterDropdown('yours')">
                        <div id="yourPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- OPPONENT PLAYERS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Players</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="oppPlayerInput" class="form-control form-control-opp" placeholder="Search opponents..."
                            oninput="filterDropdown('opp')" onfocus="filterDropdown('opp')">
                        <div id="oppPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <!-- PLAYER TAGS -->
            <div id="playerTags" class="tag-list"></div>

        </div>

        <button class="primary-action-btn" onclick="addGraph()">
            Add Graph
        </button>
    </div>

    <div id="graphsContainer"></div>

</div>

<!-- ═══════════════════════════════════════════════════
     HEAD-TO-HEAD & MATCHUPS TAB
════════════════════════════════════════════════════ -->
<div id="headToHeadTab" style="display:none;">

    <!-- ═══════════════════════════════════════════════════
         HEAD-TO-HEAD GRAPH BUILDER
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Head-to-Head Graph Builder</h2>

        <div class="form-grid-3">
            <div>
                <label class="field-label">Type</label>
                <select id="h2hChartType" class="form-control" onchange="updateH2HSelections()">
                    <option value="team">Team</option>
                    <option value="player">Player</option>
                </select>
            </div>
            <div>
                <label class="field-label">Stat</label>
                <select id="h2hChartStat" class="form-control">
                    <option value="points">Points</option>
                    <option value="assists">Assists</option>
                    <option value="rebounds">Rebounds</option>
                    <option value="steals">Steals</option>
                    <option value="blocks">Blocks</option>
                    <option value="turnovers">Turnovers</option>
                    <option value="fg_made">FG Made</option>
                    <option value="three_made">3PM</option>
                    <option value="plus_minus">Plus/Minus</option>
                    <option value="dunks">Dunks</option>
                </select>
            </div>
            <div>
                <label class="field-label">Last N Matchups</label>
                <input type="number" id="h2hChartLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <!-- H2H TEAM BUILDER -->
        <div id="h2hTeamBuilder">

            <div class="form-grid-2">

                <!-- H2H YOUR TEAMS -->
                <div>
                    <label class="field-label field-label-user">Your Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hYourTeamInput" class="form-control" placeholder="Search your teams..."
                            oninput="filterH2HTeamDropdown('yours')" onfocus="filterH2HTeamDropdown('yours')">
                        <div id="h2hYourTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- H2H OPPONENT TEAMS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hOppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..."
                            oninput="filterH2HTeamDropdown('opp')" onfocus="filterH2HTeamDropdown('opp')">
                        <div id="h2hOppTeamDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <div id="h2hTeamTags" class="tag-list"></div>

        </div>

        <!-- H2H PLAYER BUILDER -->
        <div id="h2hPlayerBuilder" class="hidden">

            <div class="form-grid-2">

                <!-- H2H YOUR PLAYERS -->
                <div>
                    <label class="field-label field-label-user">Your Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hYourPlayerInput" class="form-control" placeholder="Search your roster..."
                            oninput="filterH2HPlayerDropdown('yours')" onfocus="filterH2HPlayerDropdown('yours')">
                        <div id="h2hYourPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

                <!-- H2H OPPONENT PLAYERS -->
                <div>
                    <label class="field-label field-label-opp">Opponent Side</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="h2hOppPlayerInput" class="form-control form-control-opp" placeholder="Search opponents..."
                            oninput="filterH2HPlayerDropdown('opp')" onfocus="filterH2HPlayerDropdown('opp')">
                        <div id="h2hOppPlayerDropdown" class="autocomplete-dropdown"></div>
                    </div>
                </div>

            </div>

            <div id="h2hPlayerTags" class="tag-list"></div>

        </div>

        <button class="primary-action-btn" onclick="addH2HGraph()">
            Add Graph
        </button>
    </div>

    <div id="h2hGraphsContainer"></div>

    <!-- ═══════════════════════════════════════════════════
        TEAM MATCHUP
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Team Matchup</h2>

        <div class="form-grid-matchup">
            <div>
                <label class="field-label">Your Team</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="teamMatchupYourTeamInput" class="form-control" placeholder="Search your teams..." autocomplete="off"
                        oninput="filterTeamMatchupDropdown('yours')" onfocus="filterTeamMatchupDropdown('yours')">
                    <div id="teamMatchupYourTeamDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Opponent Team</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="teamMatchupOppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..." autocomplete="off"
                        oninput="filterTeamMatchupDropdown('opp')" onfocus="filterTeamMatchupDropdown('opp')">
                    <div id="teamMatchupOppTeamDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Last N Games</label>
                <input type="number" id="teamMatchupLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <button class="primary-action-btn" onclick="loadTeamMatchup()">
            Generate
        </button>
        <div id="teamMatchupResults" class="results-container"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════
        PLAYER MATCHUP TABLE
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Player Matchup</h2>

        <div class="form-grid-player-matchup">
            <div>
                <label class="field-label">Players (Your Team)</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="matchupPlayerInput" class="form-control" placeholder="Type a player name..."
                        oninput="filterMatchupDropdown()" onfocus="filterMatchupDropdown()">
                    <div id="matchupPlayerDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Opponent Team</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="playerMatchupOppTeamInput" class="form-control form-control-opp" placeholder="Search opponent teams..." autocomplete="off"
                        oninput="filterPlayerMatchupOppTeamDropdown()" onfocus="filterPlayerMatchupOppTeamDropdown()">
                    <div id="playerMatchupOppTeamDropdown" class="autocomplete-dropdown"></div>
                </div>
            </div>

            <div>
                <label class="field-label">Last N Games</label>
                <input type="number" id="playerMatchupLimit" class="form-control" min="1" placeholder="All" autocomplete="off">
            </div>
        </div>

        <button class="primary-action-btn" onclick="loadPlayerMatchup()">
            Generate
        </button>
        <div id="playerMatchupResults" class="results-container"></div>
    </div>

</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/analysis.css') }}">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
window.analysisData = {
    teams: {{ teams | tojson }},
    oppTeams: {{ opp_teams | tojson }},
    yourPlayers: {{ your_players | tojson }},
    oppPlayers: {{ opp_players | tojson }}
};
</script>
<script src="{{ url_for('static', filename='js/analysis.js') }}"></script>

{% endblock %}
