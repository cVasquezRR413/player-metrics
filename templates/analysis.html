{% extends "base.html" %}
{% block content %}

<h1>Analysis</h1>

<!-- ═══════════════════════════════════════════════════
     ANALYSIS TABS
════════════════════════════════════════════════════ -->
<div class="analysis-tabs">
    <button id="generalTabBtn" class="analysis-tab active" onclick="switchAnalysisTab('general')">
        General
    </button>
    <button id="headToHeadTabBtn" class="analysis-tab" onclick="switchAnalysisTab('headToHead')">
        Head-to-Head & Matchups
    </button>
</div>

<!-- ═══════════════════════════════════════════════════
     GENERAL TAB
════════════════════════════════════════════════════ -->
<div id="generalTab">

    <!-- ═══════════════════════════════════════════════════
         GRAPH BUILDER
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Build a Graph</h2>

        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:1rem; margin-bottom:1rem;">
            <div>
                <label class="field-label">Type</label>
                <select id="chartType" onchange="updateSelections()" style="width:100%;">
                    <option value="team">Team</option>
                    <option value="player">Player</option>
                </select>
            </div>
            <div>
                <label class="field-label">Stat</label>
                <select id="chartStat" style="width:100%;">
                    <option value="points">Points</option>
                    <option value="assists">Assists</option>
                    <option value="rebounds">Rebounds</option>
                    <option value="steals">Steals</option>
                    <option value="blocks">Blocks</option>
                    <option value="turnovers">Turnovers</option>
                    <option value="fg_made">FG Made</option>
                    <option value="three_made">3PM</option>
                    <option value="plus_minus">Plus/Minus</option>
                    <option value="dunks">Dunks</option>
                </select>
            </div>
            <div>
                <label class="field-label">Last N Games</label>
                <select id="chartLimit" style="width:100%;">
                    <option value="all">All Games</option>
                    <option value="10">Last 10</option>
                    <option value="20" selected>Last 20</option>
                    <option value="50">Last 50</option>
                </select>
            </div>
        </div>

        <!-- TEAM BUILDER -->
        <div id="teamBuilder">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1rem;">

                <!-- YOUR TEAMS -->
                <div>
                    <label class="field-label" style="color:#98002E;">Your Teams</label>
                    <div style="position:relative;">
                        <input type="text" id="yourTeamInput" placeholder="Search your teams..."
                            oninput="filterTeamDropdown('yours')" onfocus="filterTeamDropdown('yours')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #333; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="yourTeamDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

                <!-- OPPONENT TEAMS -->
                <div>
                    <label class="field-label" style="color:#2196F3;">Opponent Teams</label>
                    <div style="position:relative;">
                        <input type="text" id="oppTeamInput" placeholder="Search opponent teams..."
                            oninput="filterTeamDropdown('opp')" onfocus="filterTeamDropdown('opp')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #2196F320; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="oppTeamDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

            </div>

            <label style="display:flex; align-items:center; gap:0.5rem; color:#aaa; font-size:0.85rem; margin-bottom:1rem;">
                <input type="checkbox" id="teamHeadToHead" checked>
                Head-to-head only
            </label>

            <!-- TEAM TAGS -->
            <div id="teamTags" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; min-height:2rem;"></div>

        </div>

        <!-- PLAYER BUILDER -->
        <div id="playerBuilder" style="display:none;">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1rem;">

                <!-- YOUR PLAYERS -->
                <div>
                    <label class="field-label" style="color:#98002E;">Your Players</label>
                    <div style="position:relative;">
                        <input type="text" id="yourPlayerInput" placeholder="Search your roster..."
                            oninput="filterDropdown('yours')" onfocus="filterDropdown('yours')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #333; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="yourPlayerDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

                <!-- OPPONENT PLAYERS -->
                <div>
                    <label class="field-label" style="color:#2196F3;">Opponent Players</label>
                    <div style="position:relative;">
                        <input type="text" id="oppPlayerInput" placeholder="Search opponents..."
                            oninput="filterDropdown('opp')" onfocus="filterDropdown('opp')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #2196F320; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="oppPlayerDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

            </div>

            <label style="display:flex; align-items:center; gap:0.5rem; color:#aaa; font-size:0.85rem; margin-bottom:1rem;">
                <input type="checkbox" id="playerHeadToHead" checked>
                Head-to-head only
            </label>

            <!-- PLAYER TAGS -->
            <div id="playerTags" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; min-height:2rem;"></div>

        </div>

        <button onclick="addGraph()"
            style="background:#98002E; color:#fff; border:none; padding:0.6rem 1.5rem; border-radius:4px; font-size:0.9rem; font-weight:600; cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;">
            Add Graph
        </button>
    </div>

    <div id="graphsContainer"></div>

</div>

<!-- ═══════════════════════════════════════════════════
     HEAD-TO-HEAD & MATCHUPS TAB
════════════════════════════════════════════════════ -->
<div id="headToHeadTab" style="display:none;">

    <!-- ═══════════════════════════════════════════════════
         HEAD-TO-HEAD GRAPH BUILDER
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Head-to-Head Graph Builder</h2>

        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:1rem; margin-bottom:1rem;">
            <div>
                <label class="field-label">Type</label>
                <select id="h2hChartType" onchange="updateH2HSelections()" style="width:100%;">
                    <option value="team">Team</option>
                    <option value="player">Player</option>
                </select>
            </div>
            <div>
                <label class="field-label">Stat</label>
                <select id="h2hChartStat" style="width:100%;">
                    <option value="points">Points</option>
                    <option value="assists">Assists</option>
                    <option value="rebounds">Rebounds</option>
                    <option value="steals">Steals</option>
                    <option value="blocks">Blocks</option>
                    <option value="turnovers">Turnovers</option>
                    <option value="fg_made">FG Made</option>
                    <option value="three_made">3PM</option>
                    <option value="plus_minus">Plus/Minus</option>
                    <option value="dunks">Dunks</option>
                </select>
            </div>
            <div>
                <label class="field-label">Last N Matchups</label>
                <select id="h2hChartLimit" style="width:100%;">
                    <option value="all">All Matchups</option>
                    <option value="5">Last 5</option>
                    <option value="10" selected>Last 10</option>
                    <option value="20">Last 20</option>
                    <option value="50">Last 50</option>
                </select>
            </div>
        </div>

        <!-- H2H TEAM BUILDER -->
        <div id="h2hTeamBuilder">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1rem;">

                <!-- H2H YOUR TEAMS -->
                <div>
                    <label class="field-label" style="color:#98002E;">Your Side</label>
                    <div style="position:relative;">
                        <input type="text" id="h2hYourTeamInput" placeholder="Search your teams..."
                            oninput="filterH2HTeamDropdown('yours')" onfocus="filterH2HTeamDropdown('yours')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #333; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="h2hYourTeamDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

                <!-- H2H OPPONENT TEAMS -->
                <div>
                    <label class="field-label" style="color:#2196F3;">Opponent Side</label>
                    <div style="position:relative;">
                        <input type="text" id="h2hOppTeamInput" placeholder="Search opponent teams..."
                            oninput="filterH2HTeamDropdown('opp')" onfocus="filterH2HTeamDropdown('opp')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #2196F320; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="h2hOppTeamDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

            </div>

            <div id="h2hTeamTags" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; min-height:2rem;"></div>

        </div>

        <!-- H2H PLAYER BUILDER -->
        <div id="h2hPlayerBuilder" style="display:none;">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1rem;">

                <!-- H2H YOUR PLAYERS -->
                <div>
                    <label class="field-label" style="color:#98002E;">Your Side</label>
                    <div style="position:relative;">
                        <input type="text" id="h2hYourPlayerInput" placeholder="Search your roster..."
                            oninput="filterH2HPlayerDropdown('yours')" onfocus="filterH2HPlayerDropdown('yours')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #333; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="h2hYourPlayerDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

                <!-- H2H OPPONENT PLAYERS -->
                <div>
                    <label class="field-label" style="color:#2196F3;">Opponent Side</label>
                    <div style="position:relative;">
                        <input type="text" id="h2hOppPlayerInput" placeholder="Search opponents..."
                            oninput="filterH2HPlayerDropdown('opp')" onfocus="filterH2HPlayerDropdown('opp')"
                            style="background:#1a1a1a; color:#e0e0e0; border:1px solid #2196F320; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                        <div id="h2hOppPlayerDropdown"
                            style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                        </div>
                    </div>
                </div>

            </div>

            <div id="h2hPlayerTags" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; min-height:2rem;"></div>

        </div>

        <button onclick="addH2HGraph()"
            style="background:#98002E; color:#fff; border:none; padding:0.6rem 1.5rem; border-radius:4px; font-size:0.9rem; font-weight:600; cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;">
            Add Graph
        </button>
    </div>

    <div id="h2hGraphsContainer"></div>

    <!-- ═══════════════════════════════════════════════════
         TEAM MATCHUP
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Team Matchup</h2>
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; margin-bottom:1rem;">
            <div>
                <label class="field-label">Your Team</label>
                <select id="teamMatchupYourTeam" style="width:100%;">
                    <option value="all">All Teams</option>
                    {% for t in teams %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="field-label">Opponent Team</label>
                <select id="teamMatchupOppTeam" style="width:100%;">
                    <option value="">Select opponent...</option>
                    {% for t in opp_teams %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button onclick="loadTeamMatchup()"
            style="background:#98002E; color:#fff; border:none; padding:0.6rem 1.5rem; border-radius:4px; font-size:0.9rem; font-weight:600; cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;">
            Generate
        </button>
        <div id="teamMatchupResults" style="margin-top:1.5rem;"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════
         PLAYER MATCHUP TABLE
    ════════════════════════════════════════════════════ -->
    <div class="card">
        <h2>Player Matchup</h2>
        <div style="display:grid; grid-template-columns:2fr 1fr; gap:1rem; margin-bottom:1rem;">
            <div>
                <label class="field-label">Players (Your Team)</label>
                <div style="position:relative;">
                    <input type="text" id="matchupPlayerInput" placeholder="Type a player name..."
                        oninput="filterMatchupDropdown()" onfocus="filterMatchupDropdown()"
                        style="background:#1a1a1a; color:#e0e0e0; border:1px solid #333; padding:0.5rem 1rem; border-radius:4px; width:100%; font-size:0.9rem; box-sizing:border-box;">
                    <div id="matchupPlayerDropdown"
                        style="display:none; position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #333; border-radius:4px; max-height:200px; overflow-y:auto; z-index:100;">
                    </div>
                </div>
                <div id="matchupPlayerTags" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.5rem;"></div>
            </div>
            <div>
                <label class="field-label">Opponent Team</label>
                <select id="playerMatchupOppTeam" style="width:100%;">
                    <option value="">Select opponent...</option>
                    {% for t in opp_teams %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button onclick="loadPlayerMatchup()"
            style="background:#98002E; color:#fff; border:none; padding:0.6rem 1.5rem; border-radius:4px; font-size:0.9rem; font-weight:600; cursor:pointer; text-transform:uppercase; letter-spacing:0.05em;">
            Generate
        </button>
        <div id="playerMatchupResults" style="margin-top:1.5rem;"></div>
    </div>

</div>

<style>
    .field-label {
        display: block;
        color: #666;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.4rem;
    }
    .player-tag {
        color: #fff;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }
    .tag-control {
        background: rgba(255,255,255,0.15);
        border: none;
        color: #fff;
        border-radius: 3px;
        padding: 0.1rem 0.4rem;
        font-size: 0.7rem;
        cursor: pointer;
    }
    .tag-control.active {
        background: rgba(255,255,255,0.35);
        font-weight: 700;
    }
    .analysis-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid #222;
    }
    .analysis-tab {
        background: transparent;
        color: #777;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 0.8rem 1rem;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .analysis-tab:hover {
        color: #e0e0e0;
    }
    .analysis-tab.active {
        color: #fff;
        border-bottom-color: #98002E;
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const teams = {{ teams | tojson }};
const oppTeams = {{ opp_teams | tojson }};
const yourPlayers = {{ your_players | tojson }};
const oppPlayers = {{ opp_players | tojson }};

const yourTeamOptions = teams.map(t => ({
    label: t,
    team_name: t,
    side: 'yours',
    key: `${t}||yours`
}));

const oppTeamOptions = oppTeams.map(t => ({
    label: t,
    team_name: t,
    side: 'opp',
    key: `${t}||opp`
}));

const yourPlayerOptions = yourPlayers.map(p => ({
    label: `${p.player_name} (${p.team_name})`,
    player_name: p.player_name,
    team_name: p.team_name,
    side: 'yours'
}));

const oppPlayerOptions = oppPlayers.map(p => ({
    label: `${p.player_name} (${p.team_name})`,
    player_name: p.player_name,
    team_name: p.team_name,
    side: 'opp'
}));

// For matchup table (your players only)
const matchupPlayerOptions = yourPlayers.map(p => ({
    label: `${p.player_name} (${p.team_name})`,
    player_name: p.player_name,
    team_name: p.team_name,
    key: `${p.player_name}||${p.team_name}`
}));

const lineColors = [
    '#98002E', '#2196F3', '#4caf50', '#FF9800', '#9C27B0',
    '#00BCD4', '#FF5722', '#8BC34A', '#FFC107', '#E91E63'
];

let graphCount = 0;
let selectedTeams = new Map();

// Graph builder player selections: key -> { option, homeAway }
let graphPlayers = new Map();

// Matchup table players
let matchupPlayers = new Map();

// H2H graph builder selections
let h2hSelectedTeams = new Map();
let h2hSelectedPlayers = new Map();

// ─── ANALYSIS TABS ───────────────────────────────────

function switchAnalysisTab(tab) {
    const generalTab = document.getElementById('generalTab');
    const headToHeadTab = document.getElementById('headToHeadTab');
    const generalBtn = document.getElementById('generalTabBtn');
    const headToHeadBtn = document.getElementById('headToHeadTabBtn');

    if (tab === 'general') {
        generalTab.style.display = 'block';
        headToHeadTab.style.display = 'none';
        generalBtn.classList.add('active');
        headToHeadBtn.classList.remove('active');
    } else {
        generalTab.style.display = 'none';
        headToHeadTab.style.display = 'block';
        generalBtn.classList.remove('active');
        headToHeadBtn.classList.add('active');
    }
}

// ─── GRAPH BUILDER ───────────────────────────────────

function updateSelections() {
    const type = document.getElementById('chartType').value;
    selectedTeams.clear();
    graphPlayers.clear();
    document.getElementById('teamTags').innerHTML = '';
    document.getElementById('playerTags').innerHTML = '';

    if (type === 'team') {
        document.getElementById('teamBuilder').style.display = 'block';
        document.getElementById('playerBuilder').style.display = 'none';
    } else {
        document.getElementById('teamBuilder').style.display = 'none';
        document.getElementById('playerBuilder').style.display = 'block';
    }
}

function filterTeamDropdown(side) {
    const inputId = side === 'yours' ? 'yourTeamInput' : 'oppTeamInput';
    const dropdownId = side === 'yours' ? 'yourTeamDropdown' : 'oppTeamDropdown';
    const options = side === 'yours' ? yourTeamOptions : oppTeamOptions;
    const accentColor = side === 'yours' ? '#98002E' : '#2196F3';

    const input = document.getElementById(inputId).value.toLowerCase();
    const dropdown = document.getElementById(dropdownId);
    dropdown.innerHTML = '';

    const filtered = options.filter(t =>
        t.label.toLowerCase().includes(input) && !selectedTeams.has(t.key)
    );

    if (filtered.length === 0) { dropdown.style.display = 'none'; return; }

    filtered.slice(0, 10).forEach(t => {
        const item = document.createElement('div');
        item.textContent = t.label;
        item.style.cssText = 'padding:0.5rem 1rem; cursor:pointer; color:#ccc; font-size:0.85rem;';
        item.onmouseenter = () => item.style.background = '#2a2a2a';
        item.onmouseleave = () => item.style.background = 'transparent';
        item.onclick = () => addTeamTag(t, accentColor, inputId, dropdownId);
        dropdown.appendChild(item);
    });

    dropdown.style.display = 'block';
}

function addTeamTag(t, accentColor, inputId, dropdownId) {
    document.getElementById(inputId).value = '';
    document.getElementById(dropdownId).style.display = 'none';

    if (selectedTeams.has(t.key)) return;

    selectedTeams.set(t.key, t);

    const sideLabel = t.side === 'yours' ? 'Yours' : 'Opp';
    const tag = document.createElement('span');
    tag.className = 'player-tag';
    tag.dataset.key = t.key;
    tag.style.background = accentColor;

    tag.innerHTML = `
        <span class="tag-name">${t.team_name} [${sideLabel}]</span>
        <span style="cursor:pointer; font-weight:bold; margin-left:0.25rem;" onclick="removeTeamTag('${t.key}')">×</span>
    `;

    document.getElementById('teamTags').appendChild(tag);
}

function removeTeamTag(key) {
    selectedTeams.delete(key);
    const tag = document.querySelector(`.player-tag[data-key="${CSS.escape(key)}"]`);
    if (tag) tag.remove();
}

function filterDropdown(side) {
    const inputId = side === 'yours' ? 'yourPlayerInput' : 'oppPlayerInput';
    const dropdownId = side === 'yours' ? 'yourPlayerDropdown' : 'oppPlayerDropdown';
    const options = side === 'yours' ? yourPlayerOptions : oppPlayerOptions;
    const accentColor = side === 'yours' ? '#98002E' : '#2196F3';

    const input = document.getElementById(inputId).value.toLowerCase();
    const dropdown = document.getElementById(dropdownId);
    dropdown.innerHTML = '';

    // Filter out already-added players (match on name+team+side)
    const existing = new Set([...graphPlayers.keys()].filter(k => k.includes(`||${side}`)).map(k => k.split('||').slice(0,2).join('||')));
    const filtered = options.filter(p =>
        p.label.toLowerCase().includes(input) && !existing.has(`${p.player_name}||${p.team_name}`)
    );

    if (filtered.length === 0) { dropdown.style.display = 'none'; return; }

    filtered.slice(0, 10).forEach(p => {
        const item = document.createElement('div');
        item.textContent = p.label;
        item.style.cssText = 'padding:0.5rem 1rem; cursor:pointer; color:#ccc; font-size:0.85rem;';
        item.onmouseenter = () => item.style.background = '#2a2a2a';
        item.onmouseleave = () => item.style.background = 'transparent';
        item.onclick = () => addPlayerTag(p, side, accentColor, inputId, dropdownId);
        dropdown.appendChild(item);
    });

    dropdown.style.display = 'block';
}

function addPlayerTag(p, side, accentColor, inputId, dropdownId) {
    document.getElementById(inputId).value = '';
    document.getElementById(dropdownId).style.display = 'none';

    // Default: both home and away
    const key = `${p.player_name}||${p.team_name}||${side}||both`;
    if (graphPlayers.has(key)) return;

    graphPlayers.set(key, { option: p, homeAway: 'both' });

    const sideLabel = side === 'yours' ? 'Yours' : 'Opp';
    const tag = document.createElement('span');
    tag.className = 'player-tag';
    tag.dataset.key = key;
    tag.style.background = accentColor;

    tag.innerHTML = `
        <span class="tag-name">${p.player_name} (${p.team_name}) [${sideLabel}]</span>
        <button class="tag-control active" data-ha="both" onclick="setHomeAway(this, '${key}', 'both')">All</button>
        <button class="tag-control" data-ha="home" onclick="setHomeAway(this, '${key}', 'home')">H</button>
        <button class="tag-control" data-ha="away" onclick="setHomeAway(this, '${key}', 'away')">A</button>
        <span style="cursor:pointer; font-weight:bold; margin-left:0.25rem;" onclick="removePlayerTag('${key}')">×</span>
    `;

    document.getElementById('playerTags').appendChild(tag);
}

function setHomeAway(btn, oldKey, newHa) {
    const tag = btn.closest('.player-tag');
    const parts = oldKey.split('||');
    const player_name = parts[0];
    const team_name = parts[1];
    const side = parts[2];
    const newKey = `${player_name}||${team_name}||${side}||${newHa}`;

    // Update map
    const entry = graphPlayers.get(oldKey);
    if (!entry) return;
    graphPlayers.delete(oldKey);
    graphPlayers.set(newKey, { ...entry, homeAway: newHa });

    // Update tag key
    tag.dataset.key = newKey;

    // Update button onclick refs
    tag.querySelectorAll('.tag-control').forEach(b => {
        const ha = b.dataset.ha;
        b.onclick = () => setHomeAway(b, newKey, ha);
        b.classList.toggle('active', ha === newHa);
    });

    // Update remove button
    tag.querySelector('span[style*="cursor:pointer"]').onclick = () => removePlayerTag(newKey);
}

function removePlayerTag(key) {
    graphPlayers.delete(key);
    const tag = document.querySelector(`.player-tag[data-key="${CSS.escape(key)}"]`);
    if (tag) tag.remove();
}

async function addGraph() {
    const type = document.getElementById('chartType').value;
    const stat = document.getElementById('chartStat').value;
    const limit = document.getElementById('chartLimit').value;
    const statLabel = document.getElementById('chartStat').selectedOptions[0].text;
    const limitLabel = document.getElementById('chartLimit').selectedOptions[0].text;

    let data, selectionKeys, selectionLabels, apiUrl;

    if (type === 'team') {
        if (selectedTeams.size === 0) { alert('Select at least one team.'); return; }

        const headToHead = document.getElementById('teamHeadToHead').checked;
        const hasYourTeam = [...selectedTeams.values()].some(t => t.side === 'yours');
        const hasOppTeam = [...selectedTeams.values()].some(t => t.side === 'opp');

        if (headToHead && (!hasYourTeam || !hasOppTeam)) {
            alert('Head-to-head graphs need at least one Your Team and one Opponent Team.');
            return;
        }

        const params = new URLSearchParams({ type: 'team', stat, limit, head_to_head: headToHead ? '1' : '0' });
        selectedTeams.forEach((v, k) => params.append('selections', k));
        const res = await fetch(`/api/chart_data?${params}`);
        data = await res.json();
        selectionKeys = [...selectedTeams.keys()];
        selectionLabels = selectionKeys.map(k => {
            const team = selectedTeams.get(k);
            const sideLabel = team.side === 'yours' ? 'Yours' : 'Opp';
            return `${team.team_name} [${sideLabel}]`;
        });
        apiUrl = 'team';
    } else {
        if (graphPlayers.size === 0) { alert('Add at least one player.'); return; }

        const headToHead = document.getElementById('playerHeadToHead').checked;
        const hasYourPlayer = [...graphPlayers.keys()].some(k => k.split('||')[2] === 'yours');
        const hasOppPlayer = [...graphPlayers.keys()].some(k => k.split('||')[2] === 'opp');

        if (headToHead && (!hasYourPlayer || !hasOppPlayer)) {
            alert('Head-to-head player graphs need at least one Your Player and one Opponent Player.');
            return;
        }

        const params = new URLSearchParams({ stat, limit, head_to_head: headToHead ? '1' : '0' });
        graphPlayers.forEach((v, k) => params.append('selections', k));
        const res = await fetch(`/api/player_graph_data?${params}`);
        data = await res.json();
        selectionKeys = [...graphPlayers.keys()];
        selectionLabels = selectionKeys.map(k => {
            const [name, team, side, ha] = k.split('||');
            const sideLabel = side === 'yours' ? 'Yours' : 'Opp';
            const haLabel = ha === 'both' ? '' : ` | ${ha === 'home' ? 'Home' : 'Away'}`;
            return `${name} [${sideLabel}${haLabel}]`;
        });
    }

    renderGraph(data, selectionKeys, selectionLabels, statLabel, limitLabel);
}

function renderGraph(data, selectionKeys, selectionLabels, statLabel, limitLabel) {
    const graphId = `graph_${graphCount++}`;

    const allGames = [];
    const seenGames = new Set();

    Object.values(data).forEach(gameList => {
        gameList.forEach(g => {
            if (!seenGames.has(g.game_id)) {
                seenGames.add(g.game_id);
                allGames.push({
                    game_id: g.game_id,
                    date: g.date
                });
            }
        });
    });

    allGames.sort((a, b) => {
        if (a.date === b.date) {
            return a.game_id - b.game_id;
        }
        return a.date.localeCompare(b.date);
    });

    const labels = allGames.map(g => g.date);

    const card = document.createElement('div');
    card.className = 'card';
    card.id = graphId;
    card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>${statLabel} — ${selectionLabels.join(' vs ')} (${limitLabel})</h2>
            <button onclick="document.getElementById('${graphId}').remove()"
                style="background:none; border:1px solid #333; color:#666; padding:0.3rem 0.8rem; border-radius:4px; cursor:pointer; font-size:0.8rem;">
                Remove
            </button>
        </div>
        <canvas id="canvas_${graphId}" height="80"></canvas>
    `;
    document.getElementById('graphsContainer').appendChild(card);

    const datasets = selectionKeys.map((key, i) => {
        const gameData = data[key] || [];
        const gameMap = {};
        gameData.forEach(g => gameMap[g.game_id] = g);

        return {
            label: selectionLabels[i],
            data: allGames.map(game => gameMap[game.game_id] ? gameMap[game.game_id].value : null),
            borderColor: lineColors[i % lineColors.length],
            backgroundColor: lineColors[i % lineColors.length] + '20',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: allGames.map(game => {
                const g = gameMap[game.game_id];
                if (!g) return '#444';
                return g.win_loss === 'W' ? '#4caf50' : '#98002E';
            }),
            tension: 0.3,
            fill: false,
            spanGaps: false
        };
    });

    new Chart(document.getElementById(`canvas_${graphId}`), {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#888' } },
                tooltip: {
                    callbacks: {
                        afterLabel: (ctx) => {
                            const key = selectionKeys[ctx.datasetIndex];
                            const gameData = data[key] || [];
                            const game = gameData.find(g => g.game_id === allGames[ctx.dataIndex].game_id);
                            if (game) {
                                const ha = game.home_away === 'H' ? 'Home' : 'Away';
                                return `${game.win_loss === 'W' ? 'WIN' : 'LOSS'} vs ${game.opp_team} (${ha})`;
                            }
                            return '';
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { color: '#666', maxTicksLimit: 15 }, grid: { color: '#1a1a1a' } },
                y: { ticks: { color: '#666' }, grid: { color: '#1a1a1a' }, min: 0 }
            }
        }
    });
}

const statLabels = {
    pts: 'PTS', ast: 'AST', reb: 'REB', stl: 'STL',
    blk: 'BLK', to_: 'TO', fgm: 'FGM', fga: 'FGA',
    fg_pct: 'FG%', tpm: '3PM', tpa: '3PA', three_pct: '3P%',
    ftm: 'FTM', fta: 'FTA', ft_pct: 'FT%'
};

function buildComparisonTable(overall, vs_opp, label) {
    const stats = Object.keys(statLabels);
    let rows = '';
    stats.forEach(stat => {
        if (overall[stat] === undefined) return;
        const o = overall[stat] ?? '-';
        const v = vs_opp[stat] ?? '-';
        let diff = '-', diffColor = '#888';
        if (typeof o === 'number' && typeof v === 'number') {
            const d = (v - o).toFixed(2);
            diff = d > 0 ? `+${d}` : `${d}`;
            diffColor = d > 0 ? '#4caf50' : d < 0 ? '#98002E' : '#888';
        }
        rows += `<tr>
            <td>${statLabels[stat]}</td>
            <td>${o}</td>
            <td>${v}</td>
            <td style="color:${diffColor}; font-weight:600;">${diff}</td>
        </tr>`;
    });
    return `
        <div style="margin-bottom:1.5rem;">
            <h3 style="margin-bottom:0.75rem;">${label}</h3>
            <table>
                <thead><tr><th>Stat</th><th>Overall Avg</th><th>vs Opponent</th><th>Diff</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}
